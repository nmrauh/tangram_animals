<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangram Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E9EEF2;
    --grid: #D9E0E7;
    --tray: #DCE3EA;
    --ink: #22314F;
    --ink-soft: #5A6886;
    --silhouette: #22314F;
    --piece-stroke: #22314F;
    --accent: #E4572E;
    --surface: #F7F9FB;
    --chip: #D3DCE5;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18202C;
      --grid: #1F2835;
      --tray: #1F2938;
      --ink: #DCE4EF;
      --ink-soft: #93A1B8;
      --silhouette: #46566F;
      --piece-stroke: #0E141C;
      --accent: #FF7A52;
      --surface: #212B39;
      --chip: #2B384A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #18202C; --grid: #1F2835; --tray: #1F2938; --ink: #DCE4EF; --ink-soft: #93A1B8;
    --silhouette: #46566F; --piece-stroke: #0E141C; --accent: #FF7A52; --surface: #212B39; --chip: #2B384A;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Quicksand", "Nunito", "Segoe UI", system-ui, sans-serif;
    font-weight: 500;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .app {
    width: min(100vw, calc(100vh * 8 / 7));
    width: min(100vw, calc(100dvh * 8 / 7));
    aspect-ratio: 8 / 7;
    container-type: size;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto 1fr auto;
    gap: 1.6cqw 2cqw;
    padding: 2.4cqw;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 2cqw;
  }
  h1 {
    margin: 0;
    font-size: 4.2cqw;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .status {
    font-size: 1.8cqw;
    line-height: 1.25;
    color: var(--ink-soft);
    text-align: right;
  }
  .app.solved .status { color: var(--accent); }

  nav {
    background: var(--tray);
    padding: 1cqw;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: minmax(0, 1fr);
    gap: 0.5cqw;
    overflow-y: auto;
    min-height: 0;
  }
  nav button {
    position: relative;
    min-height: 0;
    padding: 0.45cqw;
    border: 0;
    border-radius: 1cqw;
    background: transparent;
    cursor: pointer;
  }
  nav button:hover { background: var(--chip); }
  nav button[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 0.25cqw var(--accent); }
  nav button:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav svg { width: 100%; height: 100%; display: block; }
  nav svg path { fill: var(--silhouette); }
  nav svg polygon { stroke: var(--piece-stroke); stroke-width: 0.6px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  nav .tick {
    position: absolute; right: 0.25cqw; top: 0.1cqw;
    color: var(--accent); font-size: 1.5cqw; font-weight: 700; line-height: 1;
    visibility: hidden;
  }
  nav button.done .tick { visibility: visible; }

  .board-wrap { min-height: 0; height: 100%; }
  #board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  .panel { fill: var(--tray); }
  .silhouette { fill: var(--silhouette); fill-rule: evenodd; transition: fill 0.4s; }
  .outline { fill: none; stroke: var(--accent); stroke-width: 0.06; stroke-linejoin: round; opacity: 0; }
  .app.solved .outline { opacity: 1; }
  .piece { stroke: var(--piece-stroke); stroke-width: 0.03; stroke-linejoin: round; cursor: grab; }
  .piece.dragging { cursor: grabbing; }
  @media (prefers-reduced-motion: no-preference) {
    .app.solved.just-solved .outline { animation: glow 1.1s ease-out; }
    @keyframes glow { 0% { stroke-width: 0.3; opacity: 0; } 40% { opacity: 1; } 100% { stroke-width: 0.06; opacity: 1; } }
  }

  footer {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 2.2cqw;
  }
  .reset {
    flex: none;
    padding: 0.8cqw 2cqw;
    border: 0;
    border-radius: 99px;
    background: var(--ink);
    color: var(--paper);
    font: inherit;
    font-size: 1.7cqw;
    font-weight: 700;
    cursor: pointer;
  }
  .reset:hover { background: var(--accent); }
  .help {
    margin: 0;
    font-size: 1.5cqw;
    line-height: 1.35;
    color: var(--ink-soft);
  }
  .help kbd {
    font: inherit;
    font-weight: 700;
    color: var(--ink);
  }
</style>
</head>

  <footer>

  </footer>
</div>

// ---------- geometry ----------
function centroid(pts) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length];
    const c = x0 * y1 - x1 * y0;
    a += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c;
  }
  return [cx / (3 * a), cy / (3 * a)];
}
function inPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inRings(x, y, rings) {
  let n = 0;
  for (const r of rings) if (inPoly(x, y, r)) n++;
  return n % 2 === 1;
}
function edgesOf(pts) { return pts.map((p, i) => [p, pts[(i + 1) % pts.length]]); }
function nearestOnSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy);
  if (t < 0 || t > 1) return null;
  return [a[0] + t * dx, a[1] + t * dy];
}

const STARTS = {"big-square":[{"k":0,"f":false,"x":2.3,"y":2.0},{"k":0,"f":false,"x":7.7,"y":7.4},{"k":0,"f":false,"x":7.7,"y":2.0},{"k":0,"f":false,"x":2.3,"y":7.4},{"k":0,"f":false,"x":5.0,"y":1.5},{"k":0,"f":false,"x":8.2,"y":4.7},{"k":0,"f":false,"x":1.8,"y":4.7}],"two-squares":[{"k":0,"f":false,"x":2.0,"y":1.7},{"k":0,"f":false,"x":8.0,"y":7.7},{"k":0,"f":false,"x":8.0,"y":1.7},{"k":0,"f":false,"x":2.0,"y":7.7},{"k":0,"f":false,"x":5.0,"y":1.9},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"turtle":[{"k":0,"f":false,"x":1.6,"y":1.3},{"k":0,"f":false,"x":7.8,"y":7.5},{"k":0,"f":false,"x":7.8,"y":1.9},{"k":0,"f":false,"x":2.1,"y":7.6},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"bird":[{"k":0,"f":false,"x":1.6,"y":1.3},{"k":0,"f":false,"x":7.6,"y":7.4},{"k":0,"f":false,"x":8.1,"y":1.6},{"k":0,"f":false,"x":1.7,"y":8.0},{"k":0,"f":false,"x":5.0,"y":0.9},{"k":0,"f":false,"x":9.0,"y":4.7},{"k":0,"f":false,"x":1.0,"y":4.7}],"cow":[{"k":0,"f":false,"x":1.6,"y":1.3},{"k":0,"f":false,"x":8.4,"y":8.1},{"k":0,"f":false,"x":7.6,"y":2.1},{"k":0,"f":false,"x":2.2,"y":7.5},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"horse":[{"k":0,"f":false,"x":1.9,"y":1.6},{"k":0,"f":false,"x":8.9,"y":8.6},{"k":0,"f":false,"x":7.2,"y":2.5},{"k":0,"f":false,"x":2.0,"y":7.7},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"kangaroo1":[{"k":0,"f":false,"x":1.5,"y":1.2},{"k":0,"f":false,"x":8.9,"y":8.6},{"k":0,"f":false,"x":6.6,"y":3.1},{"k":0,"f":false,"x":1.7,"y":8.0},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"koi":[{"k":0,"f":false,"x":2.2,"y":1.9},{"k":0,"f":false,"x":8.2,"y":8.0},{"k":0,"f":false,"x":7.5,"y":2.2},{"k":0,"f":false,"x":1.5,"y":8.2},{"k":0,"f":false,"x":5.0,"y":1.2},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"cat":[{"k":0,"f":false,"x":1.4,"y":1.1},{"k":0,"f":false,"x":8.2,"y":8.0},{"k":0,"f":false,"x":7.4,"y":2.3},{"k":0,"f":false,"x":1.4,"y":8.3},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":9.0,"y":4.7},{"k":0,"f":false,"x":1.0,"y":4.7}],"crab":[{"k":0,"f":false,"x":2.0,"y":1.7},{"k":0,"f":false,"x":8.0,"y":7.7},{"k":0,"f":false,"x":8.0,"y":1.7},{"k":0,"f":false,"x":2.0,"y":7.7},{"k":0,"f":false,"x":5.0,"y":0.9},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"dog":[{"k":0,"f":false,"x":1.6,"y":1.3},{"k":0,"f":false,"x":8.1,"y":7.8},{"k":0,"f":false,"x":8.3,"y":1.4},{"k":0,"f":false,"x":1.9,"y":7.8},{"k":0,"f":false,"x":5.0,"y":1.0},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"rabbit":[{"k":0,"f":false,"x":2.1,"y":1.8},{"k":0,"f":false,"x":8.4,"y":8.1},{"k":0,"f":false,"x":8.1,"y":1.6},{"k":0,"f":false,"x":2.3,"y":7.3},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":8.3,"y":4.7},{"k":0,"f":false,"x":1.7,"y":4.7}],"whale":[{"k":0,"f":false,"x":2.1,"y":1.8},{"k":0,"f":false,"x":7.6,"y":7.3},{"k":0,"f":false,"x":8.5,"y":1.2},{"k":0,"f":false,"x":2.0,"y":7.7},{"k":0,"f":false,"x":5.0,"y":1.3},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"butterfly":[{"k":0,"f":false,"x":1.6,"y":1.3},{"k":0,"f":false,"x":7.7,"y":7.5},{"k":0,"f":false,"x":7.8,"y":1.9},{"k":0,"f":false,"x":1.9,"y":7.8},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"penguin":[{"k":0,"f":false,"x":2.4,"y":2.1},{"k":0,"f":false,"x":8.1,"y":7.8},{"k":0,"f":false,"x":8.6,"y":1.1},{"k":0,"f":false,"x":2.2,"y":7.5},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":8.8,"y":4.7},{"k":0,"f":false,"x":1.2,"y":4.7}],"camel":[{"k":0,"f":false,"x":1.5,"y":1.2},{"k":0,"f":false,"x":8.4,"y":8.1},{"k":0,"f":false,"x":7.2,"y":2.5},{"k":0,"f":false,"x":2.2,"y":7.5},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":8.8,"y":4.7},{"k":0,"f":false,"x":1.1,"y":4.7}],"bear":[{"k":0,"f":false,"x":2.3,"y":2.0},{"k":0,"f":false,"x":7.5,"y":7.3},{"k":0,"f":false,"x":7.9,"y":1.8},{"k":0,"f":false,"x":1.9,"y":7.8},{"k":0,"f":false,"x":5.0,"y":1.4},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"swan":[{"k":0,"f":false,"x":2.0,"y":1.8},{"k":0,"f":false,"x":8.0,"y":7.7},{"k":0,"f":false,"x":7.1,"y":2.5},{"k":0,"f":false,"x":2.2,"y":7.5},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":8.8,"y":4.7},{"k":0,"f":false,"x":1.1,"y":4.7}],"fish":[{"k":0,"f":false,"x":2.6,"y":2.3},{"k":0,"f":false,"x":7.6,"y":7.3},{"k":0,"f":false,"x":7.6,"y":2.1},{"k":0,"f":false,"x":2.6,"y":7.1},{"k":0,"f":false,"x":5.0,"y":0.7},{"k":0,"f":false,"x":9.0,"y":4.7},{"k":0,"f":false,"x":1.0,"y":4.7}],"seal":[{"k":0,"f":false,"x":1.8,"y":1.6},{"k":0,"f":false,"x":7.4,"y":7.1},{"k":0,"f":false,"x":8.3,"y":1.4},{"k":0,"f":false,"x":2.3,"y":7.3},{"k":0,"f":false,"x":5.0,"y":0.9},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"pig":[{"k":0,"f":false,"x":2.5,"y":2.3},{"k":0,"f":false,"x":8.4,"y":8.1},{"k":0,"f":false,"x":7.9,"y":1.8},{"k":0,"f":false,"x":1.8,"y":7.9},{"k":0,"f":false,"x":5.0,"y":1.7},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}],"snail":[{"k":0,"f":false,"x":2.6,"y":2.3},{"k":0,"f":false,"x":8.3,"y":8.0},{"k":0,"f":false,"x":7.3,"y":2.4},{"k":0,"f":false,"x":1.8,"y":7.8},{"k":0,"f":false,"x":5.0,"y":1.5},{"k":0,"f":false,"x":9.1,"y":4.7},{"k":0,"f":false,"x":0.8,"y":4.7}]};
function trayState() { return STARTS[PUZZLES[cur].id].map(p => ({ ...p })); }
let state = [];
let zorder = START.map((_, i) => i);

function world(i, st = state[i]) {
  const a = st.k * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
  return BASE[i].rel.map(([x, y]) => {
    if (st.f) x = -x;
    return [x * c - y * s + st.x, x * s + y * c + st.y];
  });
}

const els = START.map((p, i) => {
  const el = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  el.setAttribute("class", "piece");
  el.dataset.i = i;
  const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
  t.textContent = p.type;
  el.appendChild(t);
  return el;
});
function draw(i) { els[i].setAttribute("points", world(i).map(p => p.map(v => v.toFixed(4)).join(",")).join(" ")); }
function drawAll() {
  const g = $("pieces");
  zorder.forEach(i => { g.appendChild(els[i]); draw(i); });
}
function raise(i) { zorder = zorder.filter(j => j !== i).concat(i); $("pieces").appendChild(els[i]); }

// One palette for every puzzle, in tray order: large, large, medium, parallelogram, square, small, small.
const PALETTE = ["#EB3B5A", "#FA8231", "#F7B731", "#20BF6B", "#2D98DA", "#3867D6", "#8854D0"];
els.forEach((el, i) => { el.style.fill = PALETTE[i]; });

// ---------- puzzle setup ----------
let cur = 0, sil = null;  // sil: { rings, samples }
function placeSilhouette(p) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const r of p.rings) for (const [x, y] of r) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const dx = (ZONE.x0 + ZONE.x1) / 2 - (x0 + x1) / 2, dy = (ZONE.y0 + ZONE.y1) / 2 - (y0 + y1) / 2;
  const rings = p.rings.map(r => r.map(([x, y]) => [x + dx, y + dy]));
  const samples = [];
  const step = 0.05;
  for (let x = x0 + dx + 0.0137; x < x1 + dx; x += step)
    for (let y = y0 + dy + 0.0219; y < y1 + dy; y += step)
      if (inRings(x, y, rings)) samples.push([x, y]);
  const verts = rings.flat();
  const edges = rings.flatMap(edgesOf);
  return { rings, samples, verts, edges, dx, dy };
}
function ringsPath(rings, k = 1, ox = 0, oy = 0) {
  return rings.map(r => "M" + r.map(([x, y]) => `${((x - ox) * k).toFixed(4)},${((y - oy) * k).toFixed(4)}`).join("L") + "Z").join("");
}

function loadPuzzle(idx) {
  cur = idx;
  app.classList.remove("just-solved");
  store.set("current", PUZZLES[idx].id);
  sil = placeSilhouette(PUZZLES[idx]);
  const d = ringsPath(sil.rings);
  $("sil").setAttribute("d", d);
  $("outline").setAttribute("d", d);
  const saved = store.get("arr:" + PUZZLES[idx].id, null);
  if (saved && saved.pieces && saved.pieces.length === 7) {
    state = saved.pieces.map(p => ({ k: ((p.k % 8) + 8) % 8, f: !!p.f, x: +p.x, y: +p.y }));
    zorder = saved.z && saved.z.length === 7 ? saved.z.slice() : START.map((_, i) => i);
  } else {
    state = trayState();
    zorder = START.map((_, i) => i);
  }
  drawAll();
  [...$("list").children].forEach((b, i) => b.setAttribute("aria-current", i === idx ? "true" : "false"));
  check(false);
}
function save() {
  store.set("arr:" + PUZZLES[cur].id, {
    pieces: state.map(s => ({ k: s.k, f: s.f, x: +s.x.toFixed(5), y: +s.y.toFixed(5) })),
    z: zorder,
  });
}

// ---------- solved check ----------
let solvedSet = new Set(store.get("solved", []));
function isSolved() {
  const polys = state.map((_, i) => world(i));
  let good = 0;
  for (const [x, y] of sil.samples) {
    let n = 0;
    for (const p of polys) if (inPoly(x, y, p)) n++;
    if (n === 1) good++;
  }
  return good >= sil.samples.length * 0.993;
}
function check(announce = true) {
  const ok = isSolved();
  app.classList.toggle("solved", ok);
  const name = PUZZLES[cur].name;
  $("status").innerHTML = ok ? `<strong>${name}</strong>: solved!` : `<strong>${name}</strong>: fill the shape with all seven pieces.`;
  if (ok && announce) {
    app.classList.remove("just-solved"); void app.offsetWidth; app.classList.add("just-solved");
  }
  if (ok) {
    // Keep the player's own solution for the puzzle's thumbnail.
    const id = PUZZLES[cur].id;
    const pieces = state.map((_, i) => world(i).map(([x, y]) => [+(x - sil.dx).toFixed(4), +(y - sil.dy).toFixed(4)]));
    store.set("solution:" + id, pieces);
    if (!solvedSet.has(id)) { solvedSet.add(id); store.set("solved", [...solvedSet]); }
    drawThumb(cur);
  }
}

// ---------- snapping ----------
function snap(i) {
  const pts = world(i);
  const tv = [...sil.verts], te = [...sil.edges];
  state.forEach((_, j) => { if (j !== i) { const w = world(j); tv.push(...w); te.push(...edgesOf(w)); } });
  let best = null, bd = VSNAP;
  for (const p of pts) for (const t of tv) {
    const d = Math.hypot(t[0] - p[0], t[1] - p[1]);
    if (d < bd) { bd = d; best = [t[0] - p[0], t[1] - p[1]]; }
  }
  if (!best) {
    bd = ESNAP;
    for (const p of pts) for (const [a, b] of te) {
      const q = nearestOnSeg(p, a, b); if (!q) continue;
      const d = Math.hypot(q[0] - p[0], q[1] - p[1]);
      if (d < bd) { bd = d; best = [q[0] - p[0], q[1] - p[1]]; }
    }
    for (const t of tv) for (const [a, b] of edgesOf(pts)) {
      const q = nearestOnSeg(t, a, b); if (!q) continue;
      const d = Math.hypot(q[0] - t[0], q[1] - t[1]);
      if (d < bd) { bd = d; best = [t[0] - q[0], t[1] - q[1]]; }
    }
  }
  if (best) { state[i].x += best[0]; state[i].y += best[1]; }
}
function clampPiece(i) {
  const s = state[i];
  s.x = Math.min(W - 0.15, Math.max(0.15, s.x));
  s.y = Math.min(H - 0.15, Math.max(0.15, s.y));
}

function turn(i, dir = 1) { state[i].k = (state[i].k + dir + 8) % 8; afterChange(i); }
function flip(i) { state[i].f = !state[i].f; afterChange(i); }
function afterChange(i) { raise(i); snap(i); clampPiece(i); draw(i); save(); check(); lastPiece = i; }

// ---------- pointer handling ----------
let drag = null, lastPiece = null;
function toBoard(e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [p.x, p.y];
}
svg.addEventListener("pointerdown", e => {
  const el = e.target.closest(".piece");
  if (!el) return;
  // Right button (or Control-click on a Mac): turn, or flip with Shift.
  // Handled here rather than on "contextmenu", which some browsers (Firefox) skip when Shift is held.
  if (e.button === 2 || (e.button === 0 && e.ctrlKey)) {
    e.preventDefault();
    const i = +el.dataset.i;
    e.shiftKey ? flip(i) : turn(i);
    return;
  }
  if (e.button !== 0) return;
  e.preventDefault();
  const i = +el.dataset.i, [px, py] = toBoard(e);
  raise(i);
  lastPiece = i;
  svg.setPointerCapture(e.pointerId);
  drag = { i, id: e.pointerId, ox: state[i].x - px, oy: state[i].y - py, sx: px, sy: py, moved: false, held: false, touch: e.pointerType !== "mouse", t: performance.now() };
  el.classList.add("dragging");
  if (drag.touch) drag.timer = setTimeout(() => { if (drag && !drag.moved) { drag.held = true; flip(i); } }, 480);
});
svg.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const [px, py] = toBoard(e);
  if (!drag.moved && Math.hypot(px - drag.sx, py - drag.sy) > 0.08) { drag.moved = true; clearTimeout(drag.timer); }
  if (!drag.moved || drag.held) return;
  const s = state[drag.i];
  s.x = px + drag.ox; s.y = py + drag.oy;
  clampPiece(drag.i);
  snap(drag.i);
  draw(drag.i);
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  clearTimeout(drag.timer);
  const d = drag; drag = null;
  els[d.i].classList.remove("dragging");
  if (d.touch && !d.moved && !d.held && performance.now() - d.t < 480) { turn(d.i); return; }
  if (d.moved && !d.held) { save(); check(); }
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);
svg.addEventListener("contextmenu", e => e.preventDefault());
svg.addEventListener("pointerover", e => { const el = e.target.closest(".piece"); if (el && !drag) lastPiece = +el.dataset.i; });
document.addEventListener("keydown", e => {
  if (lastPiece == null || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "f") { flip(lastPiece); e.preventDefault(); }
  else if (k === "r") { turn(lastPiece, e.shiftKey ? -1 : 1); e.preventDefault(); }
});

$("reset").addEventListener("click", () => {
  state = trayState(); zorder = START.map((_, i) => i);
  drawAll(); save(); check(false);
});

// ---------- board decoration & puzzle list ----------
(function decorate() {
  const z = $("zonePanel");
  z.setAttribute("x", ZONE.x0); z.setAttribute("y", ZONE.y0); z.setAttribute("width", ZONE.x1 - ZONE.x0); z.setAttribute("height", ZONE.y1 - ZONE.y0);
})();

// Thumbnails show the silhouette, or the player's own colored solution once solved.
function drawThumb(idx) {
  const p = PUZZLES[idx], b = $("list").children[idx];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const r of p.rings) for (const [x, y] of r) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const span = Math.max(x1 - x0, y1 - y0), k = 10 / span;
  const ox = x0 - (span - (x1 - x0)) / 2, oy = y0 - (span - (y1 - y0)) / 2;
  const sol = store.get("solution:" + p.id, null);
  let inner;
  if (sol && sol.length === 7) {
    inner = sol.map((pts, i) => `<polygon fill="${PALETTE[i]}" points="${pts.map(([x, y]) => `${((x - ox) * k).toFixed(3)},${((y - oy) * k).toFixed(3)}`).join(" ")}"/>`).join("");
    b.classList.remove("done");
  } else {
    inner = `<path fill-rule="evenodd" d="${ringsPath(p.rings, k, ox, oy)}"/>`;
    b.classList.toggle("done", solvedSet.has(p.id));   // solved before thumbnails kept solutions
  }
  b.innerHTML = `<svg viewBox="-0.5 -0.5 11 11" aria-hidden="true">${inner}</svg><span class="tick" aria-hidden="true">✓</span>`;
  b.setAttribute("aria-label", p.name + (solvedSet.has(p.id) ? ", solved" : ""));
}
PUZZLES.forEach((p, idx) => {
  const b = document.createElement("button");
  b.type = "button";
  b.title = p.name;
  b.addEventListener("click", () => loadPuzzle(idx));
  $("list").appendChild(b);
  drawThumb(idx);
});

// Keep the board exactly as tall as the puzzle list, so all three panels share one height.
const nav = $("list"), wrap = svg.parentElement;
new ResizeObserver(() => {
  const h = nav.getBoundingClientRect().height;
  wrap.style.width = (h * W / H) + "px";
  nav.style.borderRadius = (0.3 * h / H) + "px";
}).observe(nav);

const startId = store.get("current", PUZZLES[0].id);
loadPuzzle(Math.max(0, PUZZLES.findIndex(p => p.id === startId)));
</script>
